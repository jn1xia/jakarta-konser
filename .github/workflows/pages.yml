name: Deploy to GitHub Pages

# The site is hosted on Vercel, so this runs only when started by hand from the Actions tab.
# To publish on GitHub Pages as well: set Settings → Pages → Source to "GitHub Actions", and add
#   push:
#     branches: [main]
# under `on:` to publish every push to main.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Collect the site
        run: mkdir _site && cp -r index.html sim.html assets src vendor _site/ && touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
