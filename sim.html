<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jakarta Konser · Simulasi View Kursi 3D</title>
<meta name="description" content="Simulasi view kursi 3D tidak resmi: lihat panggung dari kursi mana pun sebelum konser.">
<meta property="og:type" content="website">
<meta property="og:title" content="Jakarta Konser · Simulasi View Kursi 3D">
<meta property="og:description" content="Cek view dari kursimu sebelum konser.">
<meta name="theme-color" content="#07070a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2307070a'/%3E%3Cpath d='M5 21a11 11 0 0 1 22 0' fill='none' stroke='%23ffd84a' stroke-width='3'/%3E%3Crect x='12' y='20' width='8' height='5' rx='1' fill='%23f1eef0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/site.css">
</head>
<body class="sim">
<canvas id="scene" tabindex="0"></canvas>

<header class="brand" id="brand" hidden>
  <p class="crumbs"><a id="back" href="index.html"></a><button type="button" class="lang" id="lang"></button></p>
  <p class="eyebrow" id="eyebrow"></p>
  <h1 class="title"><span class="tape t1" id="artist"></span><span class="tape t2" id="tour"></span></h1>
  <p class="venue"><b id="venueName"></b><br><span id="dates"></span></p>
  <p class="meta"><span class="dday" id="dday" hidden></span><span class="acc" id="accuracy"></span></p>
</header>

<div class="dock" id="dock" role="toolbar" hidden>
  <div class="seg"><span class="seg-label" id="lbl-view"></span>
    <div class="seg-btns" role="group" aria-labelledby="lbl-view">
      <button type="button" id="btn-pov" aria-pressed="true"></button>
      <button type="button" id="btn-over" aria-pressed="false"></button>
    </div></div>
  <div class="seg"><span class="seg-label" id="lbl-zoom"></span>
    <div class="seg-btns" role="group" aria-labelledby="lbl-zoom">
      <button type="button" data-zoom="1" aria-pressed="true"></button>
      <button type="button" data-zoom="2" aria-pressed="false">2×</button>
      <button type="button" data-zoom="4" aria-pressed="false">4×</button>
    </div></div>
  <div class="seg"><span class="seg-label" id="lbl-light"></span>
    <div class="seg-btns" role="group" aria-labelledby="lbl-light">
      <button type="button" id="btn-show" aria-pressed="true"></button>
      <button type="button" id="btn-house" aria-pressed="false"></button>
    </div></div>
  <div class="seg"><span class="seg-label" id="lbl-crowd"></span>
    <div class="seg-btns" role="group" aria-labelledby="lbl-crowd">
      <button type="button" id="btn-sit" aria-pressed="true"></button>
      <button type="button" id="btn-stand" aria-pressed="false"></button>
    </div></div>
  <p class="hint" id="hint"></p>
</div>

<aside class="panel" id="panel" hidden>
  <button type="button" class="sheet-toggle" id="sheetToggle" aria-expanded="true" aria-controls="panelRest"></button>
  <div class="panel-scroll">
    <section class="now" aria-live="polite">
      <div class="now-top"><span class="chip" id="nowChip"><i></i><span id="nowCat"></span></span><span class="price" id="nowPrice"></span></div>
      <h2 id="nowTitle"></h2>
      <p class="sub" id="nowSub"></p>
      <p class="verdict" id="verdict"></p>
    </section>
    <div class="rest" id="panelRest">
      <dl class="stats" id="stats"></dl>
      <section class="block" aria-labelledby="h-pick">
        <h3 id="h-pick"></h3>
        <div class="map-wrap"><svg id="map" role="img"></svg></div>
        <div class="field"><label for="secSel" id="secLbl"></label><select id="secSel"></select></div>
        <div class="field"><label for="rowIn" id="rowLbl"></label><input type="range" id="rowIn" min="1" max="10" value="1"><output id="rowOut" for="rowIn">1</output></div>
        <div class="field"><label for="seatIn" id="seatLbl"></label><input type="range" id="seatIn" min="1" max="10" value="1"><output id="seatOut" for="seatIn">1</output></div>
      </section>
      <section class="block" aria-labelledby="h-cats">
        <h3 id="h-cats"></h3>
        <ul class="cats" id="catList"></ul>
      </section>
      <div class="fine" id="fine"></div>
    </div>
  </div>
</aside>

<div class="tip" id="tip" hidden></div>
<div class="loading" id="loading"></div>
<div class="fallback" id="fallback" hidden><p id="fallbackText"></p></div>
<div class="message" id="message" hidden>
  <h2 id="messageTitle"></h2>
  <p><a id="messageLink" href="index.html"></a></p>
</div>

<script src="vendor/three.min.js"></script>
<script type="module" src="src/sim/main.js"></script>
</body>
</html>
